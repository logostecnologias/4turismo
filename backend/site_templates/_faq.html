{# Perguntas frequentes em <details>: abre e fecha sem script, e o texto todo
   está no HTML, que é o que o buscador e as IAs leem. #}
{% if perguntas %}
<div class="faq">
  {% for q in perguntas %}
  <details data-4t="faq" data-4t-detalhe="{{ q.pergunta[:80] }}"{% if loop.first and abrir_primeira %} open{% endif %}>
    <summary>{{ q.pergunta }}</summary>
    {% for par in q.resposta.split("\n") if par.strip() %}<p>{{ par }}</p>{% endfor %}
  </details>
  {% endfor %}
</div>
{% endif %}
